name: Build BH2VSQ BASE Core

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update a GitHub Release after a successful build"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Tag for a manual release, for example v0.1.0"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bh2vsq-base-package-${{ github.ref }}
  cancel-in-progress: false

env:
  UNITY_VERSION: "2022.3.22f1"
  PACKAGE_FILE: "BH2VSQ_BASE_Core.unitypackage"

jobs:
  build:
    name: Build UnityPackage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Unity license configuration
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Configure UNITY_EMAIL and UNITY_PASSWORD as repository Actions secrets."
            exit 1
          fi
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "::error::Configure UNITY_LICENSE for Unity Personal, or UNITY_SERIAL for Unity Pro/Plus."
            exit 1
          fi

      - name: Bootstrap VRChat SDK 3.10.4
        shell: pwsh
        run: ./tools/Bootstrap-VRChat.ps1

      - name: Prepare Unity package cache
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: BH2VSQ.Base.CI.CiBuildPipeline.Prepare
          versioning: None
          allowDirtyBuild: true

      - name: Extract TextMesh Pro Essential Resources
        shell: bash
        run: |
          python3 tools/Extract-Tmp-Essentials.py
          test -s "Assets/TextMesh Pro/Resources/TMP Settings.asset"
          echo "TMP Essential Resources prepared successfully."

      - name: Build and validate Unity package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: BH2VSQ.Base.CI.CiBuildPipeline.Run
          versioning: None
          allowDirtyBuild: true

      - name: Verify package and write checksum
        shell: bash
        run: |
          test -s "Releases/$PACKAGE_FILE"
          (
            cd Releases
            sha256sum "$PACKAGE_FILE" > SHA256SUMS.txt
          )
          cat Releases/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BH2VSQ_BASE_Core-${{ github.run_id }}
          path: |
            Releases/BH2VSQ_BASE_Core.unitypackage
            Releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: BH2VSQ_BASE_Core-${{ github.run_id }}
          path: Releases

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
            if [[ -z "$tag" ]]; then
              echo "::error::release_tag is required when publish_release is enabled."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ "$tag" != v* ]]; then
            echo "::error::Release tags must start with v (for example v0.1.0)."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              Releases/BH2VSQ_BASE_Core.unitypackage \
              Releases/SHA256SUMS.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              Releases/BH2VSQ_BASE_Core.unitypackage \
              Releases/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
